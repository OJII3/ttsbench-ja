[project]
name = "ttsbench-ja"
version = "0.1.0"
description = "Reproducible Japanese ASR model benchmarks"
requires-python = ">=3.10,<3.11"
dependencies = [
  "datasets>=2.21,<3",
  "faster-whisper==1.2.1",
  "jaconv>=0.2.4,<1",
  "huggingface-hub>=0.20.3,<0.24",
  "jiwer>=4,<5",
  "nemo_toolkit[asr]==2.0.0rc0",
  "numpy<2",
  "psutil>=7,<8",
  "pytorch-lightning>=2.2.1,<2.6",
  "torch==2.6.0",
  "nvidia-ml-py>=13,<14",
  "pyyaml>=6,<7",
  "soundfile>=0.13,<0.14",
]

[project.scripts]
asrbench-ja = "ttsbench_ja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttsbench_ja"]

[tool.uv]
package = true
